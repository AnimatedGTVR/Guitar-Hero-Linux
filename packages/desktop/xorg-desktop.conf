Section "ServerFlags"
    # GHL uses devtmpfs without a udev daemon. backstage-session adds every
    # event device explicitly, so Xorg must not wait for udev discovery.
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier "GHL VirtIO GPU"
    Driver "modesetting"
    # See packages/backstage/xorg.conf: AccelMethod glamor hits real DRM
    # command errors on this virtio-gpu/Venus combination. Left unset so
    # Xorg falls back to unaccelerated 2D + software GLX.
EndSection

Section "Screen"
    Identifier "GHL Screen"
    Device "GHL VirtIO GPU"
EndSection
