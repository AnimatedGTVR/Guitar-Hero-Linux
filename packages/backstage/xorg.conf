Section "ServerFlags"
    # GHL uses devtmpfs without a udev daemon. backstage-session adds every
    # event device explicitly, so Xorg must not wait for udev discovery.
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Module"
    # Clone Hero's Unity player needs a real GLX context; without this,
    # Xorg advertises no GL at all and the game segfaults almost
    # immediately trying to create one. DRI2/DRI3 are built into the
    # server core in this Xorg version, not separate loadable modules.
    Load "glx"
EndSection

Section "Device"
    Identifier "GHL VirtIO GPU"
    Driver "modesetting"
    # Deliberately NOT setting AccelMethod glamor: this QEMU/kernel/Mesa
    # combination's virtio-gpu Venus path throws real DRM command-submission
    # errors under glamor ("*ERROR* response 0x1203"), which crashes
    # anything trying to actually render through it — including Backstage's
    # own SDL renderer. Leaving AccelMethod unset makes Xorg fall back
    # cleanly to unaccelerated 2D, while GLX still gets a working (if
    # software) DRISWRAST provider from the "Load glx" above — enough for
    # Clone Hero to get a real GL context without touching the broken path.
EndSection

Section "Screen"
    Identifier "GHL Screen"
    Device "GHL VirtIO GPU"
EndSection
